# Domains the hourly run draws from. Edit freely: add domains, remove ones you
# don't want, or add seed slugs to steer what gets written next. Seeds are
# suggestions, not a queue: skip any that already exist.
# Each domain becomes a SKOS ConceptScheme (cm:scheme/<domain>) in the graph.
#
# Goal: practical, evidence-aware help for communicating better at work —
# with depth on consulting, executive and client communication, written
# communication in government settings, and cross-cultural communication.

domains:
  foundations:
    label: Foundations of communication
    seeds: [communication-models, audience-analysis, shannon-weaver-model, transactional-model-of-communication, encoding-and-decoding, noise-in-communication, register-and-tone, clarity, rapport, grices-maxims]
  listening:
    label: Listening and understanding
    seeds: [active-listening, paraphrasing, reflective-listening, open-ended-questions, labeling-emotions, mirroring, listening-to-understand-vs-respond, summarizing, silence-and-pauses, interrupting]
  questioning-and-conversation:
    label: Questioning and conversation
    seeds: [socratic-questioning, follow-up-questions, small-talk, conversational-turn-taking, humble-inquiry, coaching-questions, the-grow-model, rapport-building]
  writing:
